# Pubblica l'agenda su GitHub Pages a ogni push sul branch main.
# Pubblica SOLO i file della pagina (non la cartella supabase/ né il README).
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp index.html styles.css app.js cloud.js config.js _site/
          mkdir _site/turni
          cp turni/index.html turni/styles.css turni/app.js turni/cloud.js turni/config.js _site/turni/
          mkdir _site/turnivr
          cp turnivr/index.html turnivr/styles.css turnivr/app.js turnivr/cloud.js turnivr/config.js _site/turnivr/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
